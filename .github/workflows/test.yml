name: tests

on:
  push:
  pull_request:

jobs:
  turbo-monorepo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - name: Install Python dependencies
        run: python -m pip install -e "packages/clify[test]"
      - name: Install Node & Turbo dependencies
        run: pnpm install --frozen-lockfile=false
      - name: Run Turborepo check and tests
        run: |
          pnpm turbo run check
          pnpm turbo run test

  python-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e "packages/clify[test]"
      - run: pytest -m "not integration"
        working-directory: packages/clify

  recorded-spotify-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e "packages/clify[test]"
      - name: Verify recorded Spotify contracts without credentials
        working-directory: packages/clify
        run: pytest tests/test_spotify_client.py tests/test_spotify_contract.py

