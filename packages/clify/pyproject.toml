[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clify"
version = "1.6.0"
description = "Metric-driven Agent-Driven Development (ADD) framework: scope-gated agents, SLA telemetry, and TDD lifecycle verification."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "harlan"}]
keywords = ["agents", "llm", "tdd", "guardrails", "telemetry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/harlan/clify"
Repository = "https://github.com/harlan/clify.git"
Documentation = "https://github.com/harlan/clify/blob/main/README.md"
"Bug Tracker" = "https://github.com/harlan/clify/issues"
Changelog = "https://github.com/harlan/clify/blob/main/CHANGELOG.md"

[project.optional-dependencies]

test = ["pytest>=7.0"]

[project.scripts]
clify = "clify_cli:main"

[tool.setuptools]
py-modules = ["core_agents", "orchestrator", "monitoring", "cliamp_client", "cliamp_agents", "cliamp_controller", "cliamp_playback", "spotify_client", "spotify_auth", "unified_library", "clify_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests requiring a live cliamp daemon (set CLIAMP_INTEGRATION=1)",
]
