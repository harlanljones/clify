[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clify"
version = "1.4.2"
description = "Metric-driven Agent-Driven Development (ADD) framework: scope-gated agents, SLA telemetry, and TDD lifecycle verification."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "harlan"}]
keywords = ["agents", "llm", "tdd", "guardrails", "telemetry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools]
py-modules = ["core_agents", "orchestrator", "monitoring"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
